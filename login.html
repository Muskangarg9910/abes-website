<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> Login and Sign Up</title>
</head>
<body>

    <h2><b>Google</b></h2>
    <h3>Sign in</h3>
    <p>to continue to Gmail</p>
    <br>

    <form action="/login" method="POST">
        
        <label for="login-email">Email or phone</label>
        <br><br>
        <input type="text" id="login-email" name="email" size="40" required>
        <br><br>

        <a href="#">Forgot email?</a>
        <br><br>

               <button type="submit">Next</button>

    </form>

    <br><br>
    <hr align="left" width="320">
    <br><br>

        <h2><b>Google</b></h2>
    <h3>Create your Google Account</h3>
    <p>to continue to Gmail</p>
    <br>

    <form action="/signup" method="POST">

        <label for="first-name">First name</label>
        <br><br>
        <input type="text" id="first-name" name="firstName" size="40" required>
        <br><br>

        <label for="last-name">Last name </label>
        <br><br>
        <input type="text" id="last-name" name="lastName" size="40">
        <br><br>

        <label for="signup-email">Username (Email address)</label>
        <br><br>
        <input type="email" id="signup-email" name="email" size="40" required>
        <br><br>

        <label for="password">Password</label>
        <br><br>
        <input type="password" id="password" name="password" size="40" required>
        <br><br>

        <label for="confirm-password">Confirm password</label>
        <br><br>
        <input type="password" id="confirm-password" name="confirmPassword" size="40" required>
        <br><br><br>

        <button type="submit">Sign up instead</button>

    </form>

    <br><br>
    <hr align="left" width="320">

   </body>
</html>
